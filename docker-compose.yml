name: event-gallery

services:
  app:
    image: ghcr.io/ak800i/event-gallery:${APP_IMAGE_TAG:-latest}
    restart: always
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the Portainer stack environment}"
      TUS_HOOK_SECRET: "${TUS_HOOK_SECRET:?Set TUS_HOOK_SECRET in the Portainer stack environment}"
      TUS_INTERNAL_URL: "http://tusd:1080"
      TUS_UPLOAD_DIR: "/data/tusd-incoming"
      TRASH_RETENTION_DAYS: "${TRASH_RETENTION_DAYS:-30}"
      TUS_INCOMPLETE_RETENTION_HOURS: "${TUS_INCOMPLETE_RETENTION_HOURS:-48}"
      STORAGE_CLEANUP_INTERVAL_MINUTES: "${STORAGE_CLEANUP_INTERVAL_MINUTES:-60}"
      TRUSTED_PROXY_CIDRS: "${EDGE_SUBNET:-172.30.0.0/24}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-5368709120}"
      # Empty means "unset": the app applies its own default pixel ceiling above
      # which a still is thumbnailed by ffmpeg rather than decoded in-process.
      IMAGE_DECODE_MAX_PIXELS: "${IMAGE_DECODE_MAX_PIXELS:-}"
      PUBLIC_RATE_LIMIT_PER_MINUTE: "${PUBLIC_RATE_LIMIT_PER_MINUTE:-12000}"
      PUBLIC_RATE_LIMIT_BURST: "${PUBLIC_RATE_LIMIT_BURST:-3000}"
      UPLOAD_CONCURRENCY_PER_IP: "${UPLOAD_CONCURRENCY_PER_IP:-50}"
      UPLOAD_BANDWIDTH_PER_IP_BYTES_PER_SEC: "${UPLOAD_BANDWIDTH_PER_IP_BYTES_PER_SEC:-1073741824}"
      # Empty means "unset": the app then sizes the pool from the CPUs it can
      # actually use. A literal default here would shadow that and pin the pool
      # no matter how much CPU the host has. On a memory-constrained host, set
      # this alongside APP_MEM_LIMIT -- a media worker can hold a decoded still
      # plus its ffmpeg child.
      MEDIA_PROCESSING_WORKERS: "${MEDIA_PROCESSING_WORKERS:-}"
      MEDIA_PROCESSING_TIMEOUT_MINUTES: "${MEDIA_PROCESSING_TIMEOUT_MINUTES:-60}"
      # Must stay below the 90s -hooks-http-timeout in deploy/tusd-entrypoint.sh;
      # the app refuses to start otherwise. That 90s is duplicated in three
      # places that cannot share a constant and must move together: this
      # comment, the two tusd flags in deploy/tusd-entrypoint.sh, and
      # `tusdHookTimeout` in backend/internal/config/config.go.
      UPLOAD_DURABILITY_WAIT_SECONDS: "${UPLOAD_DURABILITY_WAIT_SECONDS:-75}"
      # Empty means "unset", as above.
      UPLOAD_DURABILITY_WORKERS: "${UPLOAD_DURABILITY_WORKERS:-}"
      UPLOAD_RETRY_MAX_BACKOFF_MINUTES: "${UPLOAD_RETRY_MAX_BACKOFF_MINUTES:-15}"
      INGEST_RECONCILE_INTERVAL_SECONDS: "${INGEST_RECONCILE_INTERVAL_SECONDS:-15}"
      # Empty means "unset": the app then defaults to twice MAX_UPLOAD_BYTES.
      INGEST_MIN_FREE_BYTES: "${INGEST_MIN_FREE_BYTES:-}"
      UPLOAD_JOB_RETENTION_DAYS: "${UPLOAD_JOB_RETENTION_DAYS:-30}"
      UPLOAD_STATUS_RATE_LIMIT_PER_MINUTE: "${UPLOAD_STATUS_RATE_LIMIT_PER_MINUTE:-6000}"
      COOKIE_SECURE: "true"
      TZ: "${TZ:-UTC}"
      UMASK: "${UMASK:-022}"
    volumes:
      - type: bind
        source: "${APP_DATA_PATH:?Set APP_DATA_PATH to an existing host directory}"
        target: /data/app
      - type: bind
        source: "${MEDIA_PATH:?Set MEDIA_PATH to an existing host directory}"
        target: /data/media
      - type: bind
        source: "${TUS_UPLOAD_PATH:?Set TUS_UPLOAD_PATH to an existing host directory}"
        target: /data/tusd-incoming
    tmpfs:
      # tmpfs pages are charged to the container's memory cgroup, so shrink
      # this via APP_TMPFS_SIZE whenever APP_MEM_LIMIT is set below it.
      - /tmp:size=${APP_TMPFS_SIZE:-256m},mode=1777
    # All three default to 0, which Docker reads as "unset" -- no limit, exactly
    # as before these keys existed. Set APP_MEMSWAP_LIMIT equal to APP_MEM_LIMIT
    # to keep the container out of host swap rather than letting it spill.
    mem_limit: "${APP_MEM_LIMIT:-0}"
    memswap_limit: "${APP_MEMSWAP_LIMIT:-0}"
    mem_reservation: "${APP_MEM_RESERVATION:-0}"
    networks:
      - edge
      - uploads
    depends_on:
      tusd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  tusd:
    image: ghcr.io/ak800i/event-gallery-tusd:${APP_IMAGE_TAG:-latest}
    # always, not unless-stopped: when dockerd itself dies it kills the
    # containers and flags them manually-stopped, so unless-stopped never
    # brings them back.
    restart: always
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TUS_UPLOAD_DIR: /data/tusd-incoming
      TUS_HOOKS_URL: "http://app:8080/api/internal/tus-hooks"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-5368709120}"
      UMASK: "${UMASK:-022}"
    volumes:
      - type: bind
        source: "${TUS_UPLOAD_PATH:?Set TUS_UPLOAD_PATH to an existing host directory}"
        target: /data/tusd-incoming
    tmpfs:
      - /tmp:size=${TUSD_TMPFS_SIZE:-64m},mode=1777
    mem_limit: "${TUSD_MEM_LIMIT:-0}"
    memswap_limit: "${TUSD_MEMSWAP_LIMIT:-0}"
    networks:
      - uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:1080/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    # See tusd above.
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in the Portainer stack environment}"
    command: tunnel run
    networks:
      - edge
    depends_on:
      app:
        condition: service_healthy

networks:
  edge:
    ipam:
      config:
        - subnet: "${EDGE_SUBNET:-172.30.0.0/24}"
  uploads:
    internal: true
